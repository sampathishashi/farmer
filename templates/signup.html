<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AgriMarket</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f8fb; color: #222; margin: 0; }
        .container { max-width: 400px; margin: 60px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(42,122,226,0.10); padding: 32px 24px; }
        h2 { color: #2a7ae2; text-align: center; margin-bottom: 24px; }
        form { display: flex; flex-direction: column; gap: 18px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #d2e3f7; font-size: 1em; }
        button { background: #2a7ae2; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        button:hover { background: #155fa0; }
        .nav { text-align: center; margin-top: 18px; }
        .nav a { color: #2a7ae2; text-decoration: none; margin: 0 8px; }
        .nav a:hover { text-decoration: underline; }
        .messages { margin-bottom: 16px; }
        .messages li { color: #0a0; font-weight: bold; list-style: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="messages">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input name="username" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <select name="type" required>
                <option value="">Select User Type</option>
                <option value="farmer">Farmer</option>
                <option value="seller">Seller</option>
                <option value="buyer">Buyer</option>
                <option value="company">Company</option>
                <option value="agent">Agent</option>
            </select>
            <button type="submit">Sign Up</button>
        </form>
        <div class="nav">
            <a href="/">Home</a> |
            <a href="/login">Already have an account? Login</a>
        </div>
    </div>
</body>
</html>
