<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Notification to Agent</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f8fb; margin: 0; }
        .container { max-width: 600px; margin: 50px auto; background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(42,122,226,0.10); padding: 36px 32px; }
        h1 { color: #2a7ae2; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select, textarea { width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 16px; font-family: inherit; }
        select:focus, textarea:focus { outline: none; border-color: #2a7ae2; }
        textarea { min-height: 120px; resize: vertical; }
        .btn { background: #2a7ae2; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #155fa0; }
        .back-btn { display: inline-block; margin-top: 20px; color: #2a7ae2; text-decoration: none; font-weight: bold; }
        .back-btn:hover { text-decoration: underline; }
        .agent-info { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .agent-info p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Send Notification to Agent</h1>
        
        <form method="POST">
            <div class="form-group">
                <label for="agent_email">Select Agent:</label>
                <select name="agent_email" id="agent_email" required>
                    <option value="">Choose an agent...</option>
                    {% for agent in agents %}
                    <option value="{{ agent.email }}">{{ agent.name }} - {{ agent.district }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="notification_type">Notification Type:</label>
                <select name="notification_type" id="notification_type">
                    <option value="farmer_request">General Request</option>
                    <option value="crop_advice">Crop Advice</option>
                    <option value="soil_help">Soil Help</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea name="message" id="message" placeholder="Enter your message to the agent..." required></textarea>
            </div>
            
            <button type="submit" class="btn">Send Notification</button>
        </form>
        
        <a href="/farmer" class="back-btn">← Back to Farmer Dashboard</a>
    </div>
</body>
</html>
